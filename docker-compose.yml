services:
  app:
    build:
      context: ./docker/php
      args:
        # Set UID/GID in your shell if yours are not 1000 (run `id -u` and `id -g`).
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: iskani-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # vendor stays inside Docker. On Windows, PHP reads big folders on the mounted
      # project incompletely (blade-icons saw 515 of 1288 icons), so vendor must not be there.
      - iskani-vendor:/var/www/html/vendor
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Inside Docker, MySQL is reached by its service name, not 127.0.0.1.
      DB_HOST: mysql
      DB_PORT: 3306
      PHP_CLI_SERVER_WORKERS: 4
    # Not `artisan serve`: it does not pass the container's env vars (DB_HOST) to the web process.
    # The router script reads the current folder as the web root, so we start inside public/.
    command: sh -c "cd public && php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: iskani-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-iskani}
      MYSQL_USER: ${DB_USERNAME:-iskani}
      MYSQL_PASSWORD: ${DB_PASSWORD:-iskani}
      TZ: Asia/Hebron
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - iskani-mysql:/var/lib/mysql
      # Runs only when the volume is created for the first time (see docker/mysql/init).
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  iskani-vendor:
  iskani-mysql:
