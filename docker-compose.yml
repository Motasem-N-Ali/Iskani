services:
  mysql:
    image: mysql:8.4
    container_name: iskani-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-iskani}
      MYSQL_USER: ${DB_USERNAME:-iskani}
      MYSQL_PASSWORD: ${DB_PASSWORD:-iskani}
      TZ: Asia/Hebron
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - iskani-mysql:/var/lib/mysql
      # Runs only when the volume is created for the first time (see docker/mysql/init).
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  iskani-mysql:
